name: Python autotests

on: 
  workflow_dispatch:
    inputs:
      deployment_target:
        description: choose tests set
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - extended
          - all
        
  
jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: run all tests
        if: "github.event.inputs.deployment_target == 'all'"
        run: python -m pytest --alluredir=allure-results
        continue-on-error: true
      - name: run smoke tests
        if: "github.event.inputs.deployment_target == 'smoke'"
        run: python -m pytest -m smoke --alluredir=allure-results
        continue-on-error: true
      - name: run regression tests
        if: "github.event.inputs.deployment_target == 'regression'"
        run: python -m pytest -m regression --alluredir=allure-results
        continue-on-error: true
      - name: run extended tests
        if: "github.event.inputs.deployment_target == 'extended'"
        run: python -m pytest -m extended --alluredir=allure-results
        continue-on-error: true
      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - name: Install allure
        run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.tgz && sudo tar -zxvf allure-2.46.2.tgz -C /opt/ && sudo ln -s /opt/allure-2.46.2/bin/allure /usr/bin/allure
      - name: generate report
        run: allure generate -c allure-results -o _site
      - name: save allure report
        uses: actions/upload-artifact@v7
        with:
          name: _site
          path: _site
          retention-days: 1
  publish-report:
    name: report publication
    runs-on: ubuntu-latest
    steps:
      - name: dowload artifacts
        uses: actions/download-artifact@v8
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1.2.9
  
        
